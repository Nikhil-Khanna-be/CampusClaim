<!DOCTYPE html>

        body { font-family: 'Public Sans', sans-serif; }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;

    body {
      min-height: max(884px, 100dvh);

<body class="bg-background text-on-background min-h-screen flex flex-col">
<!-- Top Bar Component - Derived from TopAppBar JSON -->
<header class="flex justify-between items-center w-full px-6 py-3 sticky top-0 z-50 bg-white shadow-sm border-b border-gray-200">
<div class="flex items-center gap-3">
<span class="material-symbols-outlined text-red-800" data-icon="school">school</span>
<span class="font-['Public_Sans'] font-semibold tracking-tight text-red-800 text-xl uppercase tracking-wider">Campus Claim</span>
</div>
<div class="flex items-center">
<button class="p-2 text-gray-600 hover:bg-gray-50 transition-colors rounded-full active:opacity-80 transition-all duration-200">
<span class="material-symbols-outlined" data-icon="notifications">notifications</span>
</button>
</div>
</header>
<main class="flex-grow flex items-center justify-center px-margin-page py-12 bg-surface-container-low relative overflow-hidden">
<!-- Abstract Background Decorative Elements -->
<div class="absolute top-0 left-0 w-full h-full opacity-5 pointer-events-none">
<div class="absolute -top-24 -left-24 w-96 h-96 bg-primary rounded-full blur-3xl"></div>
<div class="absolute -bottom-24 -right-24 w-96 h-96 bg-primary rounded-full blur-3xl"></div>
</div>
<div class="w-full max-w-[440px] z-10">
<!-- Login Card -->
<div class="bg-surface-container-lowest border border-outline-variant rounded-xl shadow-[0_4px_12px_rgba(0,0,0,0.05)] overflow-hidden">
<div class="p-stack-lg border-b border-outline-variant bg-white">
<div class="flex flex-col items-center text-center space-y-stack-sm">
<div class="w-16 h-16 bg-primary-container rounded-xl flex items-center justify-center mb-2">
<span class="material-symbols-outlined text-white text-3xl" data-icon="school" style="font-variation-settings: 'FILL' 1;">school</span>
</div>
<h1 class="font-h1 text-h1 text-primary">University Login</h1>
<p class="font-body-sm text-body-sm text-secondary">Sign in to manage your lost and found items</p>
</div>
</div>
<div class="p-stack-lg space-y-stack-md">
<!-- Login Form -->
<form class="space-y-stack-md" onsubmit="return false;">
<div class="space-y-2">
<label class="font-label-caps text-label-caps text-on-surface-variant block" for="id-field">Student/Staff ID</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-outline text-lg" data-icon="badge">badge</span>
<input class="w-full pl-10 pr-4 py-3 bg-white border border-outline-variant rounded-lg font-body-sm text-on-surface focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-all" id="id-field" placeholder="Enter your University ID" type="text"/>
</div>
</div>
<div class="space-y-2">
<div class="flex justify-between items-center">
<label class="font-label-caps text-label-caps text-on-surface-variant block" for="password-field">Password</label>
<a class="font-label-caps text-label-caps text-primary hover:underline transition-all" href="#">Forgot Password?</a>
</div>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-outline text-lg" data-icon="lock">lock</span>
<input class="w-full pl-10 pr-4 py-3 bg-white border border-outline-variant rounded-lg font-body-sm text-on-surface focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-all" id="password-field" placeholder="••••••••" type="password"/>
</div>
</div>
<button class="w-full py-4 bg-primary text-white font-button text-button rounded-lg hover:bg-primary-container transition-all shadow-md active:scale-[0.98] mt-stack-sm" type="submit">
                            Login
                        </button>
</form>
<div class="relative flex items-center py-2">
<div class="flex-grow border-t border-outline-variant"></div>
<span class="flex-shrink mx-4 font-label-caps text-label-caps text-outline">NEW TO CAMPUS?</span>
<div class="flex-grow border-t border-outline-variant"></div>
</div>
<button class="w-full py-3 border border-outline text-primary font-button text-button rounded-lg hover:bg-surface-container-low transition-all active:scale-[0.98]">
                        Create Student Account
                    </button>
</div>
<!-- Card Footer Info -->
<div class="px-stack-lg py-4 bg-surface-container-low text-center">
<p class="font-body-sm text-body-sm text-secondary flex items-center justify-center gap-2">
<span class="material-symbols-outlined text-[18px]" data-icon="verified_user">verified_user</span>
                        Secure Institutional Access
                    </p>
</div>
</div>
<!-- Accessibility/Help Links -->
<div class="mt-stack-lg flex justify-center gap-stack-lg">
<a class="font-body-sm text-body-sm text-secondary hover:text-primary transition-colors" href="#">Campus Map</a>
<a class="font-body-sm text-body-sm text-secondary hover:text-primary transition-colors" href="#">Help Center</a>
<a class="font-body-sm text-body-sm text-secondary hover:text-primary transition-colors" href="#">IT Support</a>
</div>
</div>
</main>
<!-- Contextual Footer -->
<footer class="py-stack-md text-center bg-white border-t border-outline-variant">
<p class="font-label-caps text-label-caps text-outline uppercase">© 2024 University Administration • Lost &amp; Found Portal</p>
</footer>
<!-- Suppressing Bottom Navigation as per Transactional Flow Rules -->
</body></html>
